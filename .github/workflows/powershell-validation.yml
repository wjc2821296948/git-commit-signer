name: PowerShell validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/v0.2-signature-audit

jobs:
  windows-powershell-51:
    name: Windows PowerShell 5.1 parser
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse GCS.ps1 with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'GCS.ps1'),
              [ref]$tokens,
              [ref]$parseErrors
          )

          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List -Force
              throw "GCS.ps1 contains PowerShell syntax errors."
          }

          Write-Host "GCS.ps1 parsed successfully with Windows PowerShell."

  powershell-7:
    name: PowerShell 7 parser
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Parse GCS.ps1 with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'GCS.ps1'),
              [ref]$tokens,
              [ref]$parseErrors
          )

          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List -Force
              throw "GCS.ps1 contains PowerShell syntax errors."
          }

          Write-Host "GCS.ps1 parsed successfully with PowerShell 7."
